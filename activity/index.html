<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="stage" data-layout="1">
      <template id="slot-tpl">
        <section class="slot" tabindex="0">
          <div class="screen">
            <canvas></canvas>
            <p class="message"></p>
          </div>
          <div class="bar">
            <span class="who"><span class="dot" aria-hidden="true"></span><span class="name"></span></span>
            <button class="mute" type="button" aria-label="Ativar som">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="cross" d="M16 9l6 6M22 9l-6 6" /></svg>
            </button>
            <input class="volume" type="range" min="0" max="1" step="0.01" value="0" aria-label="Volume" />
            <button class="full" type="button" aria-label="Tela cheia">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /><path class="exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" /></svg>
            </button>
          </div>
        </section>
      </template>
    </main>

    <nav id="dock">
      <div id="channels" aria-label="Quem está transmitindo"></div>
      <div id="layout" role="group" aria-label="Quantas telas">
        <button type="button" data-layout="1" aria-pressed="true" title="Uma tela">
          <svg viewBox="0 0 24 16" aria-hidden="true"><rect x="1" y="1" width="22" height="14" rx="2" /></svg>
        </button>
        <button type="button" data-layout="2" aria-pressed="false" title="Duas telas lado a lado">
          <svg viewBox="0 0 24 16" aria-hidden="true"><rect x="1" y="1" width="10" height="14" rx="2" /><rect x="13" y="1" width="10" height="14" rx="2" /></svg>
        </button>
      </div>
    </nav>
    <script type="module" src="/main.js"></script>
  </body>
</html>
