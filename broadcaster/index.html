<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src ws: wss:" />
    <title>laele viewer</title>
    <link rel="stylesheet" href="node_modules/@fontsource-variable/unbounded/index.css" />
    <link rel="stylesheet" href="node_modules/@fontsource-variable/figtree/index.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">laele viewer</span>
      <div class="about">
        <button id="about" class="tb-btn tb-small" type="button" title="Versão e atualização" aria-haspopup="dialog" aria-expanded="false" aria-controls="about-panel" aria-label="Versão e atualização">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
          <span id="update-dot" class="update-dot" hidden></span>
        </button>
        <div id="about-panel" class="about-panel" role="dialog" aria-label="Versão e atualização" hidden>
          <p>Versão <strong id="version"></strong></p>
          <p id="update-status" class="update-status" role="status"></p>
          <button id="update" class="primary" type="button" hidden>Atualizar</button>
        </div>
      </div>
      <button id="logs" class="tb-btn tb-small" type="button" title="Abrir logs" aria-label="Abrir logs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M9 13h6M9 17h6" /></svg>
      </button>
      <button id="minimize" class="tb-btn" type="button" aria-label="Minimizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
      </button>
      <button id="close" class="tb-btn tb-close" type="button" aria-label="Fechar (continua na bandeja)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
      </button>
    </header>

    <form id="setup" class="view" hidden>
      <header>
        <h1>laele viewer</h1>
        <p class="hint">Vincule sua conta do Discord (com o Discord aberto neste PC): o nome que seus amigos veem é o seu apelido no servidor. Fica salvo para as próximas vezes.</p>
      </header>

      <!-- Só em servidor sem login do Discord. -->
      <label id="name-field" class="field" hidden>
        <span>Seu nome</span>
        <input id="name" maxlength="32" autocomplete="off" />
      </label>

      <label class="field">
        <span>Endereço do servidor</span>
        <input id="server" type="url" autocomplete="off" required />
        <small>No PC do servidor: http://localhost:5173. Amigos: o endereço do túnel que o dono do servidor passar.</small>
      </label>

      <label class="field">
        <span>Senha para transmitir</span>
        <input id="password" type="password" autocomplete="off" required />
      </label>

      <p id="linked" class="linked" hidden>
        Conta do Discord vinculada<span id="linked-name"></span>.
        <button id="unlink" class="link" type="button">Desvincular</button>
      </p>

      <p id="setup-error" class="error" role="alert"></p>
      <button id="setup-submit" class="primary" type="submit">Vincular conta do Discord</button>
    </form>

    <main id="app" class="view" data-state="idle" hidden>
      <header class="top">
        <div class="identity">
          <h1 id="who"></h1>
          <p id="status" role="status">Pronto para transmitir</p>
          <div class="links">
            <button id="edit" class="link" type="button">Alterar endereço ou senha</button>
          </div>
        </div>
      </header>

      <section class="field">
        <span id="sources-label">O que você quer mostrar</span>
        <div id="sources" role="radiogroup" aria-labelledby="sources-label"></div>
      </section>

      <section class="quality">
        <span class="quality-label">Qualidade</span>
        <div class="seg" id="res" role="radiogroup" aria-label="Resolução">
          <button type="button" role="radio" data-value="1080">1080p</button>
          <button type="button" role="radio" data-value="720">720p</button>
          <button type="button" role="radio" data-value="480">480p</button>
        </div>
        <div class="seg" id="fps" role="radiogroup" aria-label="Quadros por segundo">
          <button type="button" role="radio" data-value="30">30 fps</button>
          <button type="button" role="radio" data-value="60">60 fps</button>
        </div>
      </section>

      <button id="toggle" class="primary" type="button">
        <span class="dot" aria-hidden="true"></span>
        <span id="toggle-label">Transmitir</span>
      </button>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
